<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <defs>
    <!-- Soft warm tones matching the brand guide -->
    <style>
      .brand-green { fill: #557355; }
      .brand-green-stroke { stroke: #557355; }
      .brand-peach { fill: #E5B5A1; }
      .brand-coral { fill: #EE9893; }
      .brand-text { font-family: 'Fraunces', Georgia, serif; font-weight: 500; }
      .brand-tagline { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- MOTHER & BABY EMBLEM -->
  <g transform="translate(150, 10)">
    <!-- Swaddle Blanket (Peach Fill) -->
    <path 
      d="M 85 96 C 65 106 60 128 72 144 C 84 158 108 160 126 150 C 142 140 138 124 126 116 C 114 108 98 102 85 96 Z" 
      fill="#E5B5A1" 
    />

    <!-- Mother's Hair (Sage Green Fill) with flowing botanical leaf shape -->
    <path 
      d="M 100 24 C 80 24 62 38 52 58 C 45 74 38 90 22 102 C 38 105 52 96 60 84 C 64 78 66 70 68 62 C 75 44 88 32 102 28 C 116 24 130 30 135 40 C 140 52 136 66 128 76 C 124 81 118 85 114 88 C 111 85 112 79 116 73 C 121 65 122 55 119 47 C 115 36 108 28 100 24 Z" 
      fill="#557355" 
    />

    <!-- Mother's Left Accent Leaf -->
    <path 
      d="M 50 90 C 34 96 24 112 22 130 C 38 128 52 118 58 102 C 60 96 58 92 50 90 Z" 
      fill="#557355" 
    />
    <path 
      d="M 28 124 C 38 118 48 110 54 100" 
      stroke="#FAF8F5" 
      stroke-width="1.5" 
      stroke-linecap="round" 
    />

    <!-- Mother's Profile (Forehead, Nose, Gentle Kiss) -->
    <path 
      d="M 108 34 C 102 44 94 56 94 66 C 94 72 98 76 100 78 C 96 82 92 86 88 90" 
      stroke="#557355" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Mother's Closed Eye & Eyebrow -->
    <path 
      d="M 90 60 C 93 64 99 64 102 60" 
      stroke="#557355" 
      stroke-width="2.5" 
      stroke-linecap="round" 
    />
    <path 
      d="M 91 54 C 95 50 101 51 105 54" 
      stroke="#557355" 
      stroke-width="2" 
      stroke-linecap="round" 
    />

    <!-- Outer Protective Cradling Arm -->
    <path 
      d="M 58 104 C 66 136 90 156 122 154 C 146 152 162 134 162 110 C 162 94 150 78 134 78" 
      stroke="#557355" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />

    <!-- Baby's Head & Cute Sleeping Profile -->
    <path 
      d="M 88 88 C 96 80 112 80 122 90 C 132 100 130 118 120 126 C 112 132 98 132 88 122" 
      stroke="#557355" 
      stroke-width="3.5" 
      stroke-linecap="round" 
    />

    <!-- Baby's Closed Smiling Eye & Eyebrow -->
    <path 
      d="M 104 98 C 107 102 112 102 115 98" 
      stroke="#557355" 
      stroke-width="2.2" 
      stroke-linecap="round" 
    />
    <path 
      d="M 105 93 C 108 90 112 91 115 93" 
      stroke="#557355" 
      stroke-width="1.8" 
      stroke-linecap="round" 
    />

    <!-- Baby's Button Nose & Sweet Smile -->
    <path 
      d="M 112 104 C 114 106 115 107 116 105" 
      stroke="#557355" 
      stroke-width="2" 
      stroke-linecap="round" 
    />
    <path 
      d="M 106 112 C 110 116 116 115 119 111" 
      stroke="#557355" 
      stroke-width="2" 
      stroke-linecap="round" 
    />

    <!-- Baby's Little Ear -->
    <path 
      d="M 124 102 C 130 104 130 112 124 114" 
      stroke="#557355" 
      stroke-width="2.5" 
      stroke-linecap="round" 
    />

    <!-- Baby's Resting Hand / Arm -->
    <path 
      d="M 118 120 C 123 122 125 128 121 132 C 115 136 109 132 107 126" 
      stroke="#E5B5A1" 
      stroke-width="2.5" 
      stroke-linecap="round" 
    />

    <!-- Floating Coral Heart -->
    <path 
      d="M 144 56 C 140 50 133 51 131 55 C 128 61 133 68 144 76 C 155 68 160 61 157 55 C 155 51 148 50 144 56 Z" 
      fill="#EE9893" 
    />
  </g>

  <!-- WORDMARK: "nimaya™" -->
  <g transform="translate(250, 245)">
    <!-- Main brand letters -->
    <text 
      x="0" 
      y="0" 
      text-anchor="middle" 
      fill="#557355" 
      font-size="68" 
      letter-spacing="-1" 
      class="brand-text"
    >
      n<tspan dx="-2">i</tspan><tspan dx="-2">m</tspan><tspan dx="-2">a</tspan><tspan dx="-2">y</tspan><tspan dx="-2">a</tspan>
    </text>

    <!-- Leaf dot over the 'i' -->
    <path 
      d="M -90 -46 C -88 -58 -74 -62 -70 -58 C -66 -54 -70 -40 -82 -36 C -88 -34 -90 -40 -90 -46 Z" 
      fill="#557355" 
    />

    <!-- TM Symbol -->
    <text 
      x="136" 
      y="-40" 
      fill="#557355" 
      font-size="14" 
      font-weight="bold" 
      font-family="'Plus Jakarta Sans', sans-serif"
    >
      TM
    </text>
  </g>

  <!-- TAGLINE: "Gentle care, from the very beginning." -->
  <text 
    x="250" 
    y="290" 
    text-anchor="middle" 
    fill="#557355" 
    font-size="16.5" 
    font-weight="400" 
    letter-spacing="2" 
    class="brand-tagline"
  >
    Gentle care, from the very beginning.
  </text>
</svg>
